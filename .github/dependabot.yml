version: 2
updates:
  # npm dependencies. An 11-advisory backlog (including a critical react-router
  # RCE) accumulated silently because nothing watched for vulnerable deps; this
  # keeps them patched.
  #
  # Only npm is enabled — not github-actions — because this repo intentionally
  # tracks floating major action tags (@v5, @v1); Dependabot's actions updater
  # would pin them to exact versions and fight that convention.
  - package-ecosystem: npm
    directory: /
    assignees:
      - jbhirsh
    # Pinned to the shared Monday 06:00 UTC sweep slot (mutation.yml,
    # gitleaks.yml, semgrep-autofix.yml) so all weekly robot output lands
    # together on Monday morning. Security updates don't wait for it: they
    # open as soon as an alert does.
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # `typescript` is an alias of @typescript/typescript6 (the 6.0 API that
    # typescript-eslint needs); a major bump would swap in TS 7, which has no
    # API, and break lint. The TS 7 compiler is @typescript/native.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    # One PR per run for everything, majors included, and one for every
    # security fix found at once, instead of a PR per package. This also keeps
    # lockstep packages together (vitest with @vitest/*, eslint with
    # @eslint/js), which can't pass as separate bumps. The cost: a major that
    # needs code changes holds the whole bundle until it's fixed.
    groups:
      all-updates:
        patterns:
          - "*"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
