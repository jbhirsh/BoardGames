version: 2
updates:
  # npm dependencies. An 11-advisory backlog (including a critical react-router
  # RCE) accumulated silently because nothing watched for vulnerable deps; this
  # keeps them patched. Grouped so routine minor/patch bumps arrive as one PR
  # rather than a swarm. Security updates come through regardless of the group.
  #
  # Only npm is enabled — not github-actions — because this repo intentionally
  # tracks floating major action tags (@v5, @v1); Dependabot's actions updater
  # would pin them to exact versions and fight that convention.
  - package-ecosystem: npm
    directory: /
    assignees:
      - jbhirsh
    # Pinned to the shared Monday 06:00 UTC sweep slot (mutation.yml,
    # gitleaks.yml, semgrep-autofix.yml) so all weekly robot output lands
    # together on Monday morning.
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # `typescript` is an alias of @typescript/typescript6 (the 6.0 API that
    # typescript-eslint needs); a major bump would swap in TS 7, which has no
    # API, and break lint. The TS 7 compiler is @typescript/native.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      # Packages that must move in lockstep: vitest 5 with coverage-v8 4
      # fails every coverage run, and @eslint/js 10 needs eslint 10, so split
      # PRs could never pass alone. Listed first so they claim these before
      # minor-and-patch, and with no update-types so majors ride together too.
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      eslint:
        patterns:
          - eslint
          - "@eslint/js"
      minor-and-patch:
        update-types:
          - minor
          - patch
