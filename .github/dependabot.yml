version: 2
updates:
  # npm dependencies. An 11-advisory backlog (including a critical react-router
  # RCE) accumulated silently because nothing watched for vulnerable deps; this
  # keeps them patched.
  #
  # Only npm is enabled — not github-actions — because this repo intentionally
  # tracks floating major action tags (@v5, @v1); Dependabot's actions updater
  # would pin them to exact versions and fight that convention.
  - package-ecosystem: npm
    directory: /
    assignees:
      - jbhirsh
    # Pinned to the shared Monday 06:00 UTC sweep slot (gitleaks.yml,
    # semgrep-autofix.yml, weekly-audit.yml) so all weekly robot output
    # lands together on Monday morning (mutation.yml's full sweep is
    # monthly, at 06:00 UTC on the 1st). Security updates don't wait for it: they
    # open as soon as an alert does.
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # Wait a week before proposing a newly published version, so a malicious
    # or broken release is usually yanked first. Security updates ignore it.
    cooldown:
      default-days: 7
    # One PR per run for everything, majors included, and one for every
    # security fix found at once, instead of a PR per package. This also keeps
    # lockstep packages together (vitest with @vitest/*, eslint with
    # @eslint/js), which can't pass as separate bumps. The cost: a major that
    # needs code changes holds the whole bundle until it's fixed.
    groups:
      # Majors that wait on another package, one group per package: each gets
      # a PR of its own, red until that package catches up, then green, and
      # auto-merge takes it, without waiting on another blocked major or
      # holding the bumps in all-updates. (Dependabot puts an update in the
      # first group that matches; this package's minors and patches go on to
      # all-updates.) Autofix leaves their red checks alone: jbhirsh/ci's
      # autofix/action.yml passes over a branch matching
      # dependabot/*/blocked-*, so keep the blocked- prefix.
      #
      # `typescript` is an alias of @typescript/typescript6 (the 6.0 API; the
      # TS 7 compiler is @typescript/native). TS 7 exports no JS API: tried
      # with typescript 7.0.2 and the latest tools (Oct 2026), eslint fails
      # with "typescript-eslint does not support TS 7.0", type-coverage with
      # "needs the TypeScript compiler API (ts.createProgram)", and depcruise
      # cruises 0 modules.
      blocked-typescript:
        update-types:
          - major
        patterns:
          - typescript
      all-updates:
        patterns:
          - "*"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
