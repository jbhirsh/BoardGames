name: Update visual baselines

# Run by hand, on a PR's branch (never main): rewrites the visual regression's
# baselines on Linux (the machine they must match; e2e.yml's E2E Tests compare
# against them) and adds them to the branch's head commit. jbhirsh/ci's
# visual-baselines/rewrite does it; this app's settings (the folders, the
# command that writes them, and `verify`) are the `visual-baselines` key of
# .github/ci.json.
#
# `verify` makes the rewrite amend the head commit and carry every other
# check's result over to it, so the Actions token's push leaves no workflow
# waiting for a maintainer's approval. So run it once every required check
# has finished and passed on the head (StrykerJS can take longer than the
# 15 minutes it waits): it refuses otherwise, and a head that edits
# .github/workflows/. It runs the E2E command itself, up to about 45
# minutes in all. The head's SHA changes: reset a local clone to the branch.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    name: Update visual baselines
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Pushes the new baselines to the branch it ran on (contents), posts the
    # carried-over check results onto it (checks) and cancels the runs the
    # push holds for approval (actions).
    permissions:
      contents: write
      checks: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: jbhirsh/ci/visual-baselines/rewrite@main
