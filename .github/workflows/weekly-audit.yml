# The weekly audit: checks that need the whole repository at once, too slow
# or too noisy for every PR, on the shared Monday 06:00 UTC sweep slot.
# jbhirsh/ci's reusable workflow runs them, each with this repo's config:
#
#   - Dead code (knip.jsonc): files nothing reaches, exports nothing
#     imports, dependencies nothing uses or uses unlisted.
#   - Duplicated code (.jscpd.json): repeated blocks outside the tests.
#   - Broken links (lychee): every link, image and #anchor in the markdown.
#   - The architecture graph (dependency-cruiser): src/, api/ and e2e/
#     (`audit.graph` in .github/ci.json) as SVGs and an HTML report, an
#     artifact linked from the run's summary. Its rules gate every PR already
#     (ci.yml); this is the picture.
#
# Each finding category keeps one issue labelled `weekly-audit`: opened or
# rewritten while there are findings, closed once a run comes back clean.
# The run itself stays green unless a tool crashes; the issues are the
# alert. Not a PR workflow, so it is no required check.
name: Weekly audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    uses: jbhirsh/ci/.github/workflows/audit.yml@main
    permissions:
      contents: read
      issues: write
