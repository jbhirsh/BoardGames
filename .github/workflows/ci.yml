name: CI

on:
  pull_request:
    branches: [main]
  # Robot-made branches (semgrep-autofix PRs, claude-autofix force-pushes) are
  # created with the default Actions token, whose events never trigger
  # pull_request workflows (recursion guard). workflow_dispatch is exempt from
  # that guard, so those workflows dispatch CI onto their branch and the check
  # runs land on the PR's head commit.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Least-privilege default. Claude Review runs in claude-review.yml, not
# here: claude-code-action skips a PR that edits the workflow file it runs
# from, so a review job in this file would skip every PR that changes CI.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # code-quality: write lets the coverage upload below reach GitHub.
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v5

      - name: Commit messages
        # Subject length, body, fixup and merge-commit rules from CLAUDE.md.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/check-commits.sh

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint (includes jsx-a11y static a11y checks)
        run: npm run lint

      - name: Architecture rules (dependency-cruiser)
        run: npm run depcruise

      - name: Type check
        run: npm run typecheck

      - name: Accessibility tests (axe-core on rendered components)
        run: npx vitest run src/__tests__/a11y.test.tsx

      - name: Unit tests with coverage
        run: npx vitest run --coverage

      # GitHub-native coverage: the main ruleset's code coverage rule reads
      # this report (Code Quality must be enabled). The action credits it to
      # the PR's head commit and skips fork PRs on its own.
      - name: Upload coverage to GitHub
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage/cobertura-coverage.xml
          language: TypeScript
          label: code-coverage/vitest
          # Until GitHub code coverage is available on the repo the upload
          # answers 404; keep that a warning so it can't turn CI red. The
          # coverage rule on main is the gate, and CI's own 80% per-file
          # threshold still fails the job above.
          fail-on-error: false

      - name: Build
        run: npm run build

      # Fail the PR on known high/critical vulnerabilities in the code that
      # actually ships. Scoped to production deps and high+ severity — a
      # personal repo shouldn't block on moderate dev-dependency churn, which
      # Dependabot handles on its own cadence.
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
