# The unit-level gate: commit messages, lint, formatting, layering, types,
# codegen drift, type coverage, unit tests with coverage, the build and the
# production dependency audit. It also runs on every push to main, so the
# job's report (jbhirsh/ci's job-summary) has main's runs to compare a pull
# request's with; the steps that read a pull request (commit messages,
# autofix triggers) run only for one.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Robot-made branches (semgrep-autofix PRs, claude-autofix force-pushes) are
  # created with the default Actions token, whose events never trigger
  # pull_request workflows (recursion guard). workflow_dispatch is exempt from
  # that guard, so those workflows dispatch CI onto their branch and the check
  # runs land on the PR's head commit.
  workflow_dispatch:

# A new push supersedes the run for the old head, whose result no longer
# gates anything. A dispatched run or a push to main has no PR number and
# groups by its branch, so it never cancels (or is cancelled by) a PR's own
# runs; a push to main cancels only main's previous run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Least-privilege default. Claude Review runs in claude-review.yml, not
# here: claude-code-action skips a PR that edits the workflow file it runs
# from, so a review job in this file would skip every PR that changes CI.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # code-quality: write lets the coverage upload below reach GitHub;
    # actions: read lets the job summary read the run's steps and earlier runs.
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      # Subject length, body, fixup and merge-commit rules (jbhirsh/ci).
      - name: Commit messages
        if: github.event_name == 'pull_request'
        uses: jbhirsh/ci/commits@main

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Autofix triggers
        # Every pull-request workflow must wake Claude autofix or be exempt
        # in .github/ci.json (jbhirsh/ci's autofix/check-triggers.mjs says
        # why), so a new one can't be left out of claude-autofix.yml.
        if: github.event_name == 'pull_request'
        uses: jbhirsh/ci/autofix/check-triggers@main

      - name: Pins
        # A version held below its major needs a reason beside it (jbhirsh/ci's
        # pins/check.mjs says what counts and where the reason goes).
        uses: jbhirsh/ci/pins@main

      - name: Lint (includes jsx-a11y static a11y checks)
        run: npm run lint

      # Prettier owns layout (.prettierrc.json, .prettierignore); a file it
      # would rewrite fails here. `npm run format` fixes it.
      - name: Formatting (Prettier)
        run: npm run format:check

      - name: Architecture rules (dependency-cruiser)
        run: npm run depcruise

      - name: Type check
        run: npm run typecheck

      # The client's typed GraphQL documents (src/gql/, committed) come from
      # api/_schema.graphql and src/client/operations/. Regenerate and fail if
      # the checked-in output differs, so a schema or operation change that
      # wasn't re-generated can't merge.
      - name: GraphQL codegen drift
        run: |
          npm run codegen
          git diff --exit-code src/gql/
          test -z "$(git status --porcelain src/gql/)"

      # No `any` anywhere: every identifier in every tsconfig project has a
      # type (type-coverage at 100%).
      - name: Type coverage
        run: npm run typecov

      # Strict mode also counts an `any` inside a type argument (Promise<any>,
      # a library's any[]). Shown in the run's summary, never gating.
      - name: Strict type coverage (information only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            echo '### Strict type coverage (information only)'
            echo
            echo '| Project | Typed identifiers |'
            echo '| --- | --- |'
            for p in app api node eval sw e2e; do
              echo "| $p | $(npx type-coverage -p "tsconfig.$p.json" --strict | grep '%') |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # The axe-core accessibility suite (src/__tests__/a11y.test.tsx) runs
      # here with the rest, not in a step of its own that would run it twice.
      #
      # JUnit for the job summary below; `default` and `github-actions` keep
      # the log and Vitest's own annotations and summary, which naming any
      # reporter would otherwise drop.
      - name: Unit tests with coverage
        run: npx vitest run --coverage --reporter=default --reporter=github-actions --reporter=junit --outputFile.junit=reports/junit.xml

      # GitHub-native coverage: the main ruleset's code coverage rule reads
      # this report (Code Quality must be enabled). The action credits it to
      # the PR's head commit and skips fork PRs on its own.
      - name: Upload coverage to GitHub
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage/cobertura-coverage.xml
          language: TypeScript
          label: code-coverage/vitest
          # Until GitHub code coverage is available on the repo the upload
          # answers 404; keep that a warning so it can't turn CI red. The
          # coverage rule on main is the gate, and CI's own 80% per-file
          # threshold still fails the job above.
          fail-on-error: false

      - name: Build
        run: npm run build

      # Fail the PR on known high/critical vulnerabilities in the code that
      # actually ships. Scoped to production deps and high+ severity — a
      # personal repo shouldn't block on moderate dev-dependency churn, which
      # Dependabot handles on its own cadence.
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      # The job's summary and report (jbhirsh/ci's job-summary): its steps
      # and unit tests beside its recent runs, published on the repository's
      # Pages by job-reports.yml once the run finishes.
      - name: Job summary
        if: ${{ !cancelled() }}
        uses: jbhirsh/ci/job-summary@main
        with:
          job: ci
          junit: reports/junit.xml
