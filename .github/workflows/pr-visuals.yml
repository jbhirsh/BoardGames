name: PR visuals

# jbhirsh/ci's visuals action. With `visuals.sharedTemplate` in .github/ci.json
# it passes every PR: visual review (`Visual changes`) decides whether a screen
# changed, and the shared PR template has no box to tick. The workflow stays
# because its check is still required in the branch rule. It is a required
# check, so it has no `paths:` filter: a filtered-out workflow never reports,
# and the PR would wait on it forever.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

# A new push or edit supersedes the previous run.
concurrency:
  group: pr-visuals-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  visuals:
    name: PR visuals
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: jbhirsh/ci/visuals@main
