# Publishes each CI and E2E run's job reports to the repository's GitHub
# Pages once the run finishes: the ci and E2E Tests (Playwright) jobs' last
# step (jbhirsh/ci's job-summary) writes each job's report, and its summary
# links to the page this puts it on. jbhirsh/ci's job-reports.yml says how;
# the site is the job-reports branch (Settings, Pages: Deploy from a branch,
# job-reports, / (root)). Not a pull-request workflow, so it's no check on a
# PR.
#
# pull-requests: write lets jbhirsh/ci's job-reports keep one comment on
# each PR with every job's summary, updated after each run; without it the
# comment is skipped.
name: Job reports

on:
  workflow_run:
    workflows: [CI, E2E]
    types: [completed]

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  publish:
    uses: jbhirsh/ci/.github/workflows/job-reports.yml@main
