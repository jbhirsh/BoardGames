# The AI code review: jbhirsh/ci's review action (review/action.yml there
# says what it does, how it checks the review read every changed file, and
# what it leaves to this repo's other checks). This repo's part is in
# .github/ci.json ("review") and the guide it names,
# .github/claude-review.md, both read from main.
#
# Its own workflow rather than a job in ci.yml: claude-code-action skips (and
# still reports success on) any PR that edits the workflow file it runs from,
# so only a PR that edits this stub skips review. It doesn't wait for CI, so
# a red PR is reviewed too. The job's `name:` is a required status check on
# main; keep it.
#
# pull_request only: the review needs PR context for inline comments, which
# dispatched runs don't have, and robot-dispatched CI shouldn't spawn further
# robot activity.
name: Claude Review

on:
  pull_request:
    branches: [main]

# A new push supersedes the review of the previous head.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  review:
    name: Claude Review
    runs-on: ubuntu-latest
    # Two passes over a big PR take minutes, not hours; the default cap is 6 h.
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: jbhirsh/ci/review@main
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
