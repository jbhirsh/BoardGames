# The AI code review: jbhirsh/ci's review action (review/action.yml there
# says what it does, how it checks the review read every changed file, and
# what it leaves to this repo's other checks). This repo's part is in
# .github/ci.json ("review") and the guide it names,
# .github/claude-review.md, both read from main.
#
# Its own workflow rather than a job in ci.yml, so it doesn't wait for CI: a
# red PR is reviewed too. The job's `name:` is a required status check on
# main; keep it.
#
# pull_request only: the review needs PR context for inline comments, which
# dispatched runs don't have, and robot-dispatched CI shouldn't spawn further
# robot activity.
name: Claude Review

on:
  pull_request:
    branches: [main]

# A new push supersedes the review of the previous head.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  review:
    name: Claude Review
    runs-on: ubuntu-latest
    # Two passes over a big PR take minutes, not hours; the default cap is 6 h.
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: jbhirsh/ci/review@main
        with:
          # Signs in by workload identity federation (the Anthropic Console's
          # Workload identity): the job's OIDC token for a short-lived Claude
          # API token, so no secret is stored. These IDs aren't secret.
          anthropic_federation_rule_id: fdrl_01BuwYpezaN3Vw9dbwvdF5JY
          anthropic_organization_id: 22970ab4-b9f2-4f4b-a7d7-d2e0bab4fcac
          anthropic_service_account_id: svac_01UZj2itXNdhewkTjp9Wv6YG
          anthropic_workspace_id: wrkspc_01GbH32ibMELoz7yNtpC8bB6
