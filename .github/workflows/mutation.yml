# Mutation testing (StrykerJS). Line coverage only proves code ran; mutation
# testing proves the tests actually *assert* on behavior by mutating the source
# and checking a test fails.
#
# Two placements (the pattern from jbhirsh/sift#67):
#   - Pull requests: mutate only the in-scope files the PR touched — fast,
#     targeted feedback on exactly the code under review. PRs that trigger the
#     workflow without changing mutable source (test/config-only edits, pure
#     deletions) run a small utils smoke scope instead, so the Stryker wiring
#     itself stays validated at PR time, not just weekly.
#   - Weekly schedule (+ manual dispatch): full sweep as a drift sensor,
#     catching test erosion PR-scoped runs can't see (e.g. a test refactor
#     weakening assertions for untouched code).
#
# The `break: 68` threshold in stryker.config.json is calibrated against the
# FULL mutation scope, so it only gates full sweeps (weekly/dispatch/local).
# PR-scoped subset runs are report-only: a subset score isn't comparable to
# the full-scope baseline (a PR touching only a weakly-mutated presentational
# file would flunk 68 with the suite's overall health unchanged), and Stryker
# has no --break CLI override, so the PR step generates a config copy with
# break: null.
name: Mutation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/utils/**"
      - "src/context/**"
      - "src/components/**"
      - "src/App.tsx"
      - "api/**"
      - "src/__tests__/**"
      - "stryker.config.json"
      - "package.json"
      - ".github/workflows/mutation.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  mutation:
    name: StrykerJS
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so PR runs can diff against the base branch.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # On PRs, narrow mutation to changed files inside the configured scope
      # (mirror the mutate list in stryker.config.json). --diff-filter=d drops
      # deletions: a removed file must not be passed to --mutate.
      - name: Determine mutation scope
        id: scope
        if: github.event_name == 'pull_request'
        # Context values enter as an env var, not a ${{ }} splice inside
        # `run:`, so the shell treats them as data, never as script text.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          CHANGED=$(git diff --name-only --diff-filter=d "origin/${BASE_REF}"...HEAD -- \
              src/utils src/context/filterReducer.ts src/components src/App.tsx api \
            | grep -E '\.(ts|tsx)$' \
            | grep -v '\.d\.ts$' \
            || true)
          if [ -z "$CHANGED" ]; then
            echo "No mutable files changed — running the utils smoke scope to validate the Stryker wiring."
            echo "mutate=src/utils/filterUrl.ts,src/utils/pickRandom.ts,src/utils/urls.ts" >> "$GITHUB_OUTPUT"
          else
            echo "Mutating changed files:"; echo "$CHANGED"
            echo "mutate=$(echo "$CHANGED" | paste -sd, -)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Stryker (changed files, report-only)
        if: github.event_name == 'pull_request'
        env:
          MUTATE_SCOPE: ${{ steps.scope.outputs.mutate }}
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("stryker.config.json", "utf8"));
            cfg.thresholds.break = null;
            fs.writeFileSync(".stryker-pr.config.json", JSON.stringify(cfg, null, 2));
          '
          npx stryker run .stryker-pr.config.json --mutate "$MUTATE_SCOPE"

      - name: Run Stryker (full sweep)
        if: github.event_name != 'pull_request'
        run: npx stryker run

      # always(): when the full sweep trips the break threshold, Stryker exits
      # nonzero after writing the report — that report is exactly what's needed
      # to diagnose the failure, so upload it anyway.
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation
          if-no-files-found: error
          retention-days: 30
