# Mutation testing (StrykerJS). Line coverage only proves code ran; mutation
# testing proves the tests actually *assert* on behavior by mutating the source
# and checking a test fails.
#
# Three placements (the first two the pattern from jbhirsh/sift#67):
#   - Pull requests: mutate only the in-scope files the PR touched — fast,
#     targeted feedback on exactly the code under review. PRs that change no
#     mutable source (data, docs, styles, workflow edits, pure deletions) run a
#     small utils smoke scope instead, so the Stryker wiring itself stays
#     validated at PR time and the required check always reports.
#   - Weekly schedule (+ manual dispatch): full sweep as a drift sensor,
#     catching test erosion PR-scoped runs can't see (e.g. a test refactor
#     weakening assertions for untouched code).
#   - Pushes to main (each merge): the whole scope again, but incremental
#     from main's latest results, so only what the merge changed is
#     re-tested. It keeps main's baseline current between sweeps, which is
#     what a PR's first run starts from; it doesn't gate anything, and it
#     waits for a first baseline (a sweep) rather than re-test everything.
#
# PRs and sweeps gate on the `break` threshold in stryker.config.json: a
# PR whose touched files score below it fails the check. A subset score is
# stricter than the full-scope one (a PR touching only a weakly-tested file
# has nowhere to hide), which is the point — the files under review are the
# ones whose tests must hold up. Stryker exits nonzero after writing the
# report, so the report is still uploaded for diagnosis.
#
# All three run in Stryker's incremental mode (--incremental): results are kept
# in reports/stryker-incremental.json, cached between runs, and a mutant is
# re-tested only when its code or the tests covering it changed; the rest
# keep their earlier result. A PR run starts from its own last file, or from
# main's latest results (a sweep or a merge) on its first push, so a second
# push re-tests only
# what moved. Reused results count toward the score exactly like fresh ones,
# and the restored file is first narrowed to the run's scope (Stryker would
# otherwise score the PR on every file in it), so the gate is the same as a
# from-scratch run over the same files. Incremental mode only sees changes
# to the mutated files and the test files; the weekly sweep starts from no
# file, re-tests everything, and saves the result as main's baseline, which
# catches anything else (helpers, data, dependencies) within a week.
#
# Stryker writes its results only when a run ends, so a run cancelled or cut
# off by the time limit saves nothing and the next one starts over. Runs
# therefore queue rather than cancel: a push made while its PR's run is going
# waits for that run, then starts from its results and re-tests only what the
# new push changed.
name: Mutation

on:
  # No `paths:` filter: StrykerJS is a required status check on main, and a
  # workflow skipped by path filtering never reports, which leaves the PR
  # pending forever. PRs that touch no mutable source fall through to the
  # utils smoke scope below (a few minutes) so the check always lands.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Queued, not cancelled (see the header): GitHub keeps one waiting run per
# group, the latest, so a burst of pushes still runs only twice. Merges and
# sweeps on main queue apart, so a merge can't push a waiting sweep out.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.event_name == 'push' && 'merge' || 'sweep' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  mutation:
    name: StrykerJS
    runs-on: ubuntu-latest
    # A PR touching many components mutates thousands of mutants: one with
    # 32 changed files (about 4,000 mutants) took 86 minutes. The cap only
    # stops a hung run, so leave such a PR room to finish.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so PR runs can diff against the base branch.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # On PRs, narrow mutation to changed files inside the configured scope
      # (mirror the mutate list in stryker.config.json). --diff-filter=d drops
      # deletions: a removed file must not be passed to --mutate.
      - name: Determine mutation scope
        id: scope
        if: github.event_name == 'pull_request'
        # Context values enter as an env var, not a ${{ }} splice inside
        # `run:`, so the shell treats them as data, never as script text.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          CHANGED=$(git diff --name-only --diff-filter=d "origin/${BASE_REF}"...HEAD -- \
              src/utils src/context/filterReducer.ts src/components src/App.tsx \
              src/sw/shell.ts src/pdfjs/saved.ts api \
            | grep -E '\.(ts|tsx)$' \
            | grep -v '\.d\.ts$' \
            || true)
          if [ -z "$CHANGED" ]; then
            echo "No mutable files changed — running the utils smoke scope to validate the Stryker wiring."
            echo "mutate=src/utils/filterUrl.ts,src/utils/pickRandom.ts,src/utils/urls.ts" >> "$GITHUB_OUTPUT"
          else
            echo "Mutating changed files:"; echo "$CHANGED"
            echo "mutate=$(echo "$CHANGED" | paste -sd, -)" >> "$GITHUB_OUTPUT"
          fi

      # This PR's own latest results, else main's latest sweep. A PR's cache
      # is visible only to that PR (main's to every PR) and each run saves
      # under a key of its own, so a prefix match restores the newest. Keys
      # name the PR by number, not branch: a cache key may not hold a comma,
      # and a branch name may. A miss just means a from-scratch run.
      - name: Restore incremental results
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stryker-incremental-pr-${{ github.event.pull_request.number }}-
            stryker-incremental-main-

      # A merge to main picks up from main's latest results, sweep or merge.
      - name: Restore main's incremental results
        id: main-baseline
        if: github.event_name == 'push'
        uses: actions/cache/restore@v6
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-main-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: stryker-incremental-main-

      # Stryker carries an incremental file's results for files outside
      # --mutate into the run and scores them with the rest, so main's
      # whole-project file would dilute the score of the files under review.
      # Narrowed, the score covers exactly this run's scope, reused or not.
      - name: Narrow incremental results to the scope
        if: github.event_name == 'pull_request'
        env:
          MUTATE_SCOPE: ${{ steps.scope.outputs.mutate }}
        run: node .github/scripts/stryker-incremental-scope.mjs reports/stryker-incremental.json "$MUTATE_SCOPE"

      - name: Run Stryker (changed files)
        if: github.event_name == 'pull_request'
        env:
          MUTATE_SCOPE: ${{ steps.scope.outputs.mutate }}
        run: npx stryker run --incremental --mutate "$MUTATE_SCOPE"

      # Only refreshes the baseline: the score is the weekly sweep's to judge
      # (main's own drift would otherwise mark the merged commit red), so a
      # run below the threshold still passes and still saves its results.
      # With no baseline yet it would re-test everything, which can outrun
      # the job's limit and save nothing, so it waits for a sweep instead.
      # Its own limit sits under the job's, so a slow run ends as a passing
      # step rather than a cancelled job.
      - name: Run Stryker (main, incremental)
        if: github.event_name == 'push' && steps.main-baseline.outputs.cache-matched-key != ''
        continue-on-error: true
        timeout-minutes: 170
        run: npx stryker run --incremental

      # No restore here: with no file to start from, every mutant is
      # re-tested, which is what a drift sensor is for, and the fresh results
      # become main's baseline. That is what --force would do on a restored
      # file, minus the stale results --force still carries over for files
      # that have since left the mutate scope.
      - name: Run Stryker (full sweep)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npx stryker run --incremental

      # always(): a run below the break threshold has still written its
      # results, and the next push should start from them (a cancelled or
      # timed-out run writes none, so there is nothing to save). A sweep or a
      # merge run is saved only on main, the one branch whose cache the PRs
      # can read.
      - name: Save incremental results
        if: >-
          always()
          && hashFiles('reports/stryker-incremental.json') != ''
          && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        uses: actions/cache/save@v6
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}-${{ github.run_id }}-${{ github.run_attempt }}

      # always(): when a run trips the break threshold, Stryker exits nonzero
      # after writing the report — that report is exactly what's needed to
      # diagnose the failure, so upload it anyway. A merge run may have no
      # report (skipped while there is no baseline, or cut off by its time
      # limit), and it gates nothing, so a missing one only warns there.
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation
          if-no-files-found: ${{ github.event_name == 'push' && 'warn' || 'error' }}
          retention-days: 30
