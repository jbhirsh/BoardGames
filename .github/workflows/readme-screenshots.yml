# Keeps the README's screenshots (docs/screenshots/) in step with the app.
# After a change that can alter how the app looks reaches main, it takes
# them again (e2e/readme.shots.ts: the production build, every /api call
# and the dictionary stubbed), and jbhirsh/ci's readme-screenshots actions
# replace those that visibly changed (over 0.5% of pixels) in one PR from
# bot/readme-screenshots, with auto-merge on: branch protection blocks a
# push to main, and the PR still runs every required check.
#
# Every push to main starts it, and the capture job decides: if anything
# the screenshots show (`readme-screenshots.shows` in .github/ci.json: the
# app, the capture spec and what it uses, the dependencies) changed since
# the last run that finished, it takes them again. With screenshots that
# changed, the publish job opens or rebuilds the bot PR on the latest main;
# with none, it closes an open one, whose pictures are stale. With nothing
# to retake, it only brings an open bot PR up to date with main, so it never
# sits behind it while main requires branches to be up to date.
#
# Two jobs, so the token that can open PRs never meets npm: capture runs
# npm, the build and Playwright with read-only permissions and no
# credentials kept, and hands the changed screenshots over as an artifact;
# publish runs no npm, with BOT_PR_TOKEN (the publish action's `token` input
# says why it's needed and what it falls back to).
name: README screenshots

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    name: Take the README screenshots
    # Only main: a dispatch from another branch would put that branch's
    # look in a PR set to merge itself into main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # To find the last finished run.
      actions: read
    outputs:
      capture: ${{ steps.decide.outputs.capture }}
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commits since the last finished run, to see what changed.
          fetch-depth: 0
          persist-credentials: false

      - id: decide
        uses: jbhirsh/ci/readme-screenshots/decide@main

      - uses: actions/setup-node@v7
        if: steps.decide.outputs.capture == 'true'
        with:
          node-version: 24
          cache: npm

      - if: steps.decide.outputs.capture == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.decide.outputs.capture == 'true'
        run: npx playwright install --with-deps chromium

      # Into readme-shots/ (e2e/readme.shots.ts).
      - name: Take the screenshots
        if: steps.decide.outputs.capture == 'true'
        env:
          README_SHOTS: "1"
        run: npx playwright test --project=readme

      - id: compare
        if: steps.decide.outputs.capture == 'true'
        uses: jbhirsh/ci/readme-screenshots/compare@main
        with:
          fresh: readme-shots

  publish:
    name: Open, update or close the bot PR
    needs: capture
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: jbhirsh/ci/readme-screenshots@main
        with:
          token: ${{ secrets.BOT_PR_TOKEN || github.token }}
          capture: ${{ needs.capture.outputs.capture }}
          changed: ${{ needs.capture.outputs.changed }}
