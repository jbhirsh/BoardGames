name: Rules Assistant Eval

on:
  # No `paths:` filter: the eval is a required status check on main, and a
  # workflow skipped by path filtering never reports, which leaves the PR
  # pending forever. The job diffs the PR itself and skips the Gemini run
  # when nothing the assistant depends on changed; a skipped step still
  # reports the job as successful.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  eval:
    name: Answer-Quality Eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so PR runs can diff against the base branch.
          fetch-depth: 0

      # Only the API, the eval harness and the rules text feed the assistant's
      # answers; a PR that touches none of them has nothing to evaluate, and
      # every Gemini call costs real money. Manual runs always evaluate.
      - name: Decide whether the eval is relevant
        id: relevant
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "origin/${BASE_REF}"...HEAD -- \
              api eval rules-text .github/workflows/eval.yml || true)
          if [ -z "$CHANGED" ]; then
            echo "skipping eval: nothing the rules assistant depends on changed"
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          else
            echo "Evaluating; changed:"; echo "$CHANGED"
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check GEMINI_API_KEY availability
        id: gate
        if: steps.relevant.outputs.relevant == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "skipping eval: GEMINI_API_KEY not available (secrets are not exposed to fork PRs)"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.available == 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.gate.outputs.available == 'true'

      - name: Run eval against golden set
        if: steps.gate.outputs.available == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run eval
