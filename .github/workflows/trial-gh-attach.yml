# Throwaway trial for jbhirsh/ci#33 (T1): whether BOT_PR_TOKEN may upload
# PR attachments with `gh --attach` (the Actions token may not). Runs only
# on its own draft PR, which is closed unmerged once the results are read.
name: Trial gh attach
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  trial:
    if: github.head_ref == 'trial-gh-attach'
    runs-on: ubuntu-latest
    steps:
      - name: Install the latest gh
        run: |
          set -eu
          tag=$(curl -fsSL https://api.github.com/repos/cli/cli/releases/latest | jq -r .tag_name)
          curl -fsSL -o gh.tgz "https://github.com/cli/cli/releases/download/${tag}/gh_${tag#v}_linux_amd64.tar.gz"
          tar xzf gh.tgz
          echo "$PWD/gh_${tag#v}_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Make a tiny test GIF
        run: printf '%s' '' | base64 -d > trial-pixel.gif
      - name: Attach a comment with BOT_PR_TOKEN
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "BOT_PR_TOKEN is not set"; exit 1; fi
          printf 'Trial with BOT_PR_TOKEN\n\n![trial](./trial-pixel.gif)\n' > body.md
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file body.md --attach ./trial-pixel.gif
      - name: Edit the description in place with BOT_PR_TOKEN
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN }}
        run: |
          printf 'Throwaway trial for jbhirsh/ci#33. Do not merge.\n\n![trial](./trial-pixel.gif)\n' > desc.md
          gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file desc.md --attach ./trial-pixel.gif
      - name: Report what came back
        if: always()
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN }}
        run: |
          n=${{ github.event.pull_request.number }}
          { gh pr view "$n" --repo ${{ github.repository }} --json body -q .body; gh api "repos/${{ github.repository }}/issues/$n/comments" -q '.[].body'; } > all.txt
          grep -n 'trial\|user-attachments' all.txt || true
          grep -oE 'https://github\.com/user-attachments/assets/[A-Za-z0-9-]+' all.txt | sort -u | while read -r u; do
            echo "$u -> $(curl -s -o /dev/null -w '%{http_code} %{content_type}' -L "$u")"
          done
