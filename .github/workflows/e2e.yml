# End-to-end tests (Playwright): the production build, served by vite
# preview, driven in Chromium through the flows people use — browsing and
# filtering the collection, the wishlist and its votes, the random picker, a
# rules page and its assistant, the score calculator and the word checker —
# and visual regression: screenshots of every page, compared with baselines,
# in Chromium, Firefox and WebKit on a desktop and on phones (e2e/visual.ts).
#
# visual-baselines.yml, run by hand, rewrites those baselines on Linux (the
# machine they must match) and commits them to its branch.
# Every /api call is stubbed (e2e/fixtures.ts, which also aborts any request
# off the preview origin) and a spec that needs the dictionary API stubs it
# itself, so the job needs no secrets and touches no live service.
#
# It also runs on every push to main, so the job's report (jbhirsh/ci's
# job-summary) has main's runs to compare a pull request's with. Nothing in
# it reads a pull request or writes anything back.
name: E2E

on:
  # No `paths:` filter: E2E Tests (Playwright) is a required status check on
  # main, and a workflow skipped by path filtering never reports, which
  # leaves the PR pending forever.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A push to main has no PR number and groups by its branch: it cancels only
# main's previous run, never a PR's.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # actions: read lets the job summary read the run's steps and earlier runs.
    permissions:
      contents: read
      actions: read
    steps:
      # The job summary's report charts the machine's CPU across the job:
      # first, so the chart covers every step (jbhirsh/ci's sample-load).
      - uses: jbhirsh/ci/job-summary/sample-load@main

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The browsers matching the installed @playwright/test, plus the system
      # libraries they need on the runner.
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # What a slow or flaky run's report is worth seeing beside its tests:
      # the Playwright release and the browsers it drove, with their
      # versions (a dry run prints them, without installing anything). Never
      # fails the job: a missing note only leaves the report without it.
      - name: Read the Playwright and browser versions
        id: playwright
        continue-on-error: true
        run: |
          echo "version=$(npx playwright --version | sed 's/^Version //')" >> "$GITHUB_OUTPUT"
          echo "browsers=$(npx playwright install --dry-run chromium firefox webkit | awk '/^[^ ]/ && !/^FFmpeg/ { sub(/ \(playwright.*/, ""); printf "%s%s", sep, $0; sep = ", " }')" >> "$GITHUB_OUTPUT"

      # Shown in the report's Environment, with the machine the first note
      # adds (jbhirsh/ci's job-summary/note).
      - name: Note them for the job summary
        uses: jbhirsh/ci/job-summary/note@main
        with:
          notes: |
            Playwright: ${{ steps.playwright.outputs.version }}
            Browsers: ${{ steps.playwright.outputs.browsers }}

      # playwright.config.ts builds the app and serves it with vite preview.
      - name: Run Playwright tests
        run: npm run test:e2e

      # cancelled() too, so a run that hits the timeout still leaves its traces.
      - name: Upload Playwright report
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      # The job's summary and report (jbhirsh/ci's job-summary): its steps
      # and tests (each named with its Playwright project, as the visual
      # suite runs the same tests in several) beside its recent runs,
      # published on the repository's Pages by the reports job below.
      - name: Job summary
        if: ${{ !cancelled() }}
        uses: jbhirsh/ci/job-summary@main
        with:
          job: E2E Tests (Playwright)
          junit: test-results/junit.xml

  # Publishes this run's job reports to the repository's Pages and keeps
  # one comment on the PR with every job's summary (jbhirsh/ci's
  # job-reports.yml), once the E2E Tests (Playwright) job is done, failed or not. As part
  # of the run, it runs from the PR's own branch. Not a required check; it
  # never fails a run for a report.
  reports:
    needs: [e2e]
    if: ${{ !cancelled() }}
    permissions:
      contents: write
      actions: read
      pull-requests: write
    uses: jbhirsh/ci/.github/workflows/job-reports.yml@main
