name: Deployment Smoke Test

# Two triggers; the smoke test runs on both, the performance probe on
# deployments only:
#
# 1. deployment_status — Vercel reports every deployment (preview and
#    production) back to GitHub. When one succeeds, probe the deployed API.
#    This exercises the compiled functions in the actual Vercel runtime — the
#    layer unit tests, tsc, and the golden-set eval never touch — so a function
#    that crashes at module load (e.g. the extensionless ESM import that broke
#    production in #26) turns into a red check on the PR instead of a silent
#    500 for users.
#
# 2. schedule — the same probes run against production twice a day, catching
#    drift between deploys: revoked/quota-exhausted API keys, model
#    retirements, or provider outages. Cost is negligible: the chat probe asks
#    about the collection's smallest rulebook (cranium, ~1.4 KB of grounding
#    text), so a month of scheduled runs is well under one cent of Gemini
#    usage, and Actions minutes are free on public repos.
#
# The performance probe (perf-probe, jbhirsh/ci's probe/web, #354) runs on
# deployments only, before the smoke test: it loads the app's pages in
# WebKit and reads each API response's Server-Timing, cold and warm, so
# each deployment's numbers don't wait for visitors. It goes first because
# the smoke test's curls would otherwise make the deployment's first
# request, and the probe would almost never see a cold start. A scheduled
# run has no probe: production is always warm by then.
#
# Preview deployments sit behind Vercel Authentication, so the request sends
# the project's Protection Bypass for Automation secret
# (VERCEL_AUTOMATION_BYPASS_SECRET). Without it, preview smoke tests fail
# loudly (401) by design rather than pretending coverage exists.

on:
  deployment_status:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

# The smoke test only curls public URLs and reads one secret, so it needs
# no repo token; each job that needs one asks for its own.
permissions: {}

jobs:
  # Not a required check: a slow number never fails it, only a measuring
  # that broke (a listed response with no Server-Timing, not 2xx, never
  # made). Its settings are the `probe` key in .github/ci.json (jbhirsh/ci's
  # probe/settings.ts says what each does): it loads the home page and
  # times its Games and Session requests; WishlistVotes is listed so that a
  # cold flag it carries is named, but not timed, as the page makes it only
  # when the wishlist has entries. It sends `x-synthetic: probe` on its
  # requests to the deployment, so its traces are marked as synthetic. A
  # deployment that isn't a success has nothing to probe.
  perf-probe:
    name: Performance probe
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    # Only a hang limit: the probe waits on events and moves on as soon as
    # they happen, each wait limited to the settings' `timeout` (60 s). The
    # required API smoke test waits for this job, so this is also the most
    # it holds that check up: 10 minutes, on a deployment that hangs.
    timeout-minutes: 10
    # contents to check out the app's settings and lockfile; actions for
    # the job summary's steps and earlier runs.
    permissions:
      contents: read
      actions: read
    steps:
      # The deployment's commit (a deployment_status run's github.sha), for
      # its probe settings and the Playwright release its lockfile pins.
      # The probe installs only Playwright, not the app's packages. No
      # token is left in .git/config: nothing here uses git again.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Production only reads: only GET and HEAD and the settings' `reads`
      # go out, and anything else is aborted before it leaves the browser.
      # Vercel names its environments Preview and Production. The bypass
      # secret goes only to a host the settings' `hosts` allow, over https,
      # and never on a browser request (probe/web/action.yml says how).
      - name: Probe the deployment
        id: probe
        uses: jbhirsh/ci/probe/web@main
        with:
          url: ${{ github.event.deployment_status.environment_url }}
          environment: ${{ github.event.deployment_status.environment == 'Preview' && 'preview' || 'production' }}
          bypass-secret: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      # The job's summary and report (jbhirsh/ci's job-summary), with the
      # probe's measurements tracked against main's earlier deployments
      # (`measurements`, the probe's results file, written even when the
      # probe fails), published on the repository's Pages by the reports
      # job below.
      - name: Job summary
        if: ${{ !cancelled() }}
        uses: jbhirsh/ci/job-summary@main
        with:
          job: Performance probe
          measurements: ${{ steps.probe.outputs.results }}

  api-smoke:
    # A deployment that isn't a success (pending, failure, error) skips
    # this job, and a skipped check passes, so its run takes another name
    # and never stands in for the required "API smoke test". A failed
    # deploy is reported by the required Vercel check.
    #
    # It waits for the performance probe (at most its 10 minutes), so the
    # probe makes the deployment's first request, but runs whatever the
    # probe did: !cancelled() runs it when the probe failed, and when it was
    # skipped (a scheduled or manual run). Its name stays, so the branch
    # rule's required check is unchanged.
    name: ${{ (github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success') && 'API smoke test' || 'API smoke test (not deployed)' }}
    needs: perf-probe
    if: ${{ !cancelled() && (github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Probe the GraphQL API's rules chat, votes, games and session, and sign-in, on the target deployment
        env:
          TARGET_URL: ${{ github.event.deployment_status.environment_url }}
          ENVIRONMENT: ${{ github.event.deployment_status.environment }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -u
          # A deployment event must carry its own URL — falling back to
          # production here would probe the wrong deployment and report a
          # green check for one that was never tested. Only the scheduled and
          # manual triggers (which have no event URL by nature) target
          # production.
          if [ "$GITHUB_EVENT_NAME" = "deployment_status" ] && [ -z "$TARGET_URL" ]; then
            echo "::error::deployment_status event carried no environment_url; cannot smoke-test"
            exit 1
          fi
          TARGET_URL="${TARGET_URL:-https://board-games-silk.vercel.app}"
          ENVIRONMENT="${ENVIRONMENT:-Production ($GITHUB_EVENT_NAME)}"
          echo "Smoke-testing $ENVIRONMENT at $TARGET_URL"

          # Only ever send the bypass secret to a Vercel host — guards against a
          # forged/unexpected deployment_status pointing environment_url elsewhere.
          host=${TARGET_URL#*://}; host=${host%%/*}
          case "$host" in
            *.vercel.app) ;;
            *) echo "::error::refusing to smoke-test unexpected host: $host"; exit 1 ;;
          esac

          # Every request says it's the smoke test's, so the API's traces
          # mark it as synthetic (#354), apart from visitors' and the
          # performance probe's (x-synthetic: probe).
          curl_args=(-H 'x-synthetic: smoke')
          if [ -n "$VERCEL_BYPASS" ]; then
            curl_args+=(-H "x-vercel-protection-bypass: $VERCEL_BYPASS")
          else
            echo "::warning::VERCEL_AUTOMATION_BYPASS_SECRET is not set; protected preview deployments will 401. See the comment at the top of this workflow."
          fi

          # probe <label> <expected-substring-or-empty> <curl args...>
          # Passes when the response is HTTP 200, non-empty, free of '"error"',
          # and (if given) contains the expected substring. One try, with no
          # pause: curl's 90 s limit covers a cold start. Only the chat probe
          # tries once more at once, when Gemini (a third party) failed: the
          # API answers every Gemini failure with a 500 "Failed to generate
          # response" (api/_resolvers/chat.ts). Its 429s and 503s are our own
          # limiters, which a retry mustn't paper over (jbhirsh/ci#58).
          probe() {
            local label="$1"; shift
            local expect="$1"; shift
            local code
            for attempt in 1 2; do
              code=$(curl -sS -o body.txt -w '%{http_code}' --max-time 90 "${curl_args[@]}" "$@") || code=000
              echo "$label attempt $attempt: HTTP $code"
              if [ "$code" = "200" ] && [ -s body.txt ] && ! grep -q '"error"' body.txt \
                 && { [ -z "$expect" ] || grep -q "$expect" body.txt; }; then
                echo "$label OK: $(head -c 200 body.txt)"
                return 0
              fi
              cat body.txt 2>/dev/null || true
              [ "$label" = "chat" ] && [ "$code" = "500" ] && grep -q 'Failed to generate response' body.txt || break
            done
            echo "::error::$label smoke test failed (HTTP $code, body above): the deployed $label endpoint didn't answer as expected"
            return 1
          }

          fail=0
          # The API is GraphQL at /api/graphql (api/graphql.ts): the rules chat
          # is a subscription answered as server-sent events, each chunk a
          # "next" event naming askRules; votes are a query. Both are JSON
          # POSTs, as every POST to it must be. The votes probe asks about an
          # id no game has (`smoke-probe`), which counts 0 whatever the owner
          # removes. The games query goes over GET, with Yoga's CSRF header.
          probe "chat" '"askRules"' -X POST "$TARGET_URL/api/graphql" \
            -H 'Content-Type: application/json' -H 'Accept: text/event-stream' \
            -d '{"query":"subscription Smoke($slug: String!, $message: String!) { askRules(slug: $slug, message: $message) }","variables":{"slug":"cranium","message":"How many players can play this game?"}}' || fail=1
          probe "votes" '"counts"' -X POST "$TARGET_URL/api/graphql" \
            -H 'Content-Type: application/json' \
            -d '{"query":"query Smoke { wishlistVotes(ids: [\"smoke-probe\"]) { counts { id count } } }"}' || fail=1
          probe "games" '"wishlist"' -H 'x-graphql-yoga-csrf: 1' \
            "$TARGET_URL/api/graphql?operationName=Games&query=query%20Games%20%7B%20games%20%7B%20wishlist%20%7B%20id%20%7D%20%7D%20%7D" || fail=1
          # Sign-in (Better Auth, api/_auth.ts) answers at /api/auth/*, which
          # vercel.json rewrites to the same function: its health check
          # proves the routing, the runtime database client's import, the
          # database's environment check and the deploy's sign-in settings,
          # none of which a preview can show by finishing a Google sign-in
          # (that goes through production). The session query, with a
          # session cookie that names nothing, has the owner check read it;
          # that counts a failure as signed out (reported to Sentry), so the
          # health check is the one that fails on a broken sign-in.
          probe "auth" '"ok":true' "$TARGET_URL/api/auth/ok" || fail=1
          probe "session" '"admin":false' -X POST "$TARGET_URL/api/graphql" \
            -H 'Content-Type: application/json' -H 'Cookie: __Secure-better-auth.session_token=smoke.test' \
            -d '{"query":"query Smoke { session { admin } }"}' || fail=1
          exit $fail

  # Publishes this run's job reports to the repository's Pages and keeps
  # one comment on the PR with every job's summary (jbhirsh/ci's
  # job-reports.yml), once the Performance probe job is done, failed or
  # not; a production deployment of main comments on no PR. As part of the
  # run, it runs from the deployment's commit. Only a deployment's run has
  # a report: the smoke test writes no job summary. Not a required check;
  # it never fails a run for a report. The workflow's permissions: {}
  # grants nothing, so it asks for what job-reports.yml's jobs need.
  reports:
    needs: [perf-probe]
    if: ${{ !cancelled() && github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' }}
    permissions:
      contents: write
      actions: read
      pull-requests: write
    uses: jbhirsh/ci/.github/workflows/job-reports.yml@main
