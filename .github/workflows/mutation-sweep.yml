name: Mutation sweep

# The monthly full mutation sweep: StrykerJS over every file in the mutation
# scope, in parallel shards, saved as main's baseline
# (jbhirsh/ci's .github/workflows/mutation-sweep.yml says how; this app's
# settings are the `mutation` key of .github/ci.json). A file of its own,
# not a job in mutation.yml, so pull requests don't list it as a skipped
# check. The pull-request and merge runs are mutation.yml.
on:
  # 06:00 UTC on the 1st. Not a "first Monday": GitHub's cron ORs the
  # day-of-month and day-of-week fields, so that would run far more often.
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

# Queued, not cancelled: Stryker writes its results only when a run ends, so
# a cancelled run saves nothing. A group of its own, apart from
# mutation.yml's merge runs, so a merge can't push a waiting sweep out.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  sweep:
    name: Mutation sweep
    uses: jbhirsh/ci/.github/workflows/mutation-sweep.yml@main
