"""
The Game Room's API, served by one Vercel function (api/graphql.ts, GraphQL
Yoga) and read by the client's codegen (codegen.ts) into src/gql/. Each
field's rules are in its resolver's header (api/_resolvers/*).

Errors carry `extensions.code` and the HTTP status that goes with it:
BAD_REQUEST and BAD_NAME (a corrected name the approve page can't look
up) 400, FORBIDDEN 403, NOT_FOUND 404, CONFLICT and ALREADY_DECIDED (with
`extensions.status`, what it was decided as) 409, RATE_LIMITED and
DAILY_LIMIT 429, INTERNAL_SERVER_ERROR 500, UNAVAILABLE 503, TIMEOUT 504.
Mutations are POST only, and every POST must be JSON.
"""
type Query {
  "Whether the request's session (Better Auth's, from /api/auth) is the owner's."
  session: Session!

  "Vote counts for up to 100 wishlist ids (malformed ones are dropped), and which of them this browser voted for."
  wishlistVotes(ids: [String!]!, anonId: String): WishlistVotes!

  """
  Every game on the wishlist, and what BoardGameGeek says about every game
  the site knows (the collection's too), with the owner's own awards. The
  same for every caller, so it's served over GET and the service worker
  keeps the last answer for offline use.
  """
  games: Games!

  "Owner: everything waiting on a decision, newest first, the ones whose email never went out included."
  pendingSuggestions: [Suggestion!]!

  "Owner, as JSON: what BoardGameGeek has for a game, or why it has nothing. Stores nothing."
  previewGame(game: String!): Preview!

  "Owner: the suggestion behind an emailed approve or deny link. Changes nothing."
  emailedSuggestion(id: String!): EmailedSuggestion!
}

type Mutation {
  "Adds (1) or takes back (0) this browser's vote for a game on the wishlist."
  vote(itemId: String!, anonId: String!, vote: Int!): VoteResult!

  """
  A friend's suggestion: stored as pending, in BoardGameGeek's spelling when
  it differs from what was typed only in case, spacing or punctuation, then
  emailed to the owner with links to the approve and deny pages.
  """
  suggestGame(game: String!, name: String!, note: String): Suggestion!

  """
  Owner (JSON): approves or denies a waiting suggestion, from the site's
  queue or an emailed link's page. An approval may bring a corrected name
  and the details previewed for it (null for none); without `details` the
  game is looked up here. Its section follows from BoardGameGeek's data.
  """
  decideSuggestion(id: String!, decision: Decision!, game: String, details: DetailsInput): Decided!

  "Owner: puts a game straight on the wishlist. `details` previewed, null for none, or absent to look it up here."
  addGame(game: String!, name: String!, note: String, details: DetailsInput): Decided!

  "Owner: changes how a wishlist game reads, whichever way it got there, and the note of the suggestion it came from."
  editGame(id: String!, game: String, note: String, details: DetailsEdit): WishlistGame

  "Owner: takes a game off the wishlist."
  removeGame(id: String!): Boolean!
}

type Subscription {
  """
  The AI rules assistant's answer to `message` about the game `slug` (and
  the rulebooks named in `parts`), streamed over server-sent events one
  text chunk at a time. An answer Gemini fails partway through ends with a
  note that it was cut off.
  """
  askRules(slug: String!, message: String!, history: [HistoryEntry!], parts: [String!]): String!
}

type Session {
  admin: Boolean!
}

type WishlistVotes {
  counts: [VoteCount!]!
  "The ids this browser (anonId) voted for."
  myVotes: [String!]!
}

type VoteCount {
  id: String!
  count: Int!
}

type VoteResult {
  itemId: String!
  count: Int!
  myVote: Int!
}

enum SuggestionStatus {
  PENDING
  APPROVED
  DENIED
  "Stored, but the email to the owner failed: off the active list, still in the owner's queue."
  UNSENT
  "The owner took it off the wishlist."
  REMOVED
}

enum Source {
  FRIEND
  OWNER
}

enum Decision {
  APPROVE
  DENY
}

"How a BoardGameGeek lookup went."
enum LookupOutcome {
  FOUND
  NO_MATCH
  "BGG_API_TOKEN isn't set, so BoardGameGeek wasn't asked."
  NO_TOKEN
  "BoardGameGeek refused the token."
  REFUSED
  UNAVAILABLE
}

enum Role {
  USER
  MODEL
}

type Suggestion {
  id: String!
  game: String!
  name: String!
  note: String!
  status: SuggestionStatus!
  "Milliseconds since the epoch."
  createdAt: Float!
  decidedAt: Float
  source: Source!
}

"The wishlist and what BoardGameGeek says about every game the site knows."
type Games {
  wishlist: [WishlistGame!]!
  bgg: [BggInfo!]!
}

enum GameSource {
  "Written into the site's code before it moved to the database."
  CURATED
  FRIEND
  OWNER
}

"A game on the wishlist."
type WishlistGame {
  id: String!
  name: String!
  source: GameSource!
  "The friend who suggested it."
  suggestedBy: String
  "The friend's note with the suggestion, empty for none."
  note: String!
  "The words a card shows (\"2–4\"), null when unknown."
  players: String
  minPlayers: Int!
  maxPlayers: Int!
  "\"30–45 min\", null when unknown."
  dur: String
  "The long end of the playing time; 0 when unknown."
  minutes: Int!
  description: String!
  keywords: [String!]!
  "The wishlist section it's filed under; null means \"Suggested by friends\"."
  section: String
  "Always null: the price-history link it fed is gone. Kept so a client still asking for it gets an answer; drop it once no deployed client selects it (removed from the app's query in #324)."
  asin: String @deprecated(reason: "The price-history link is gone; always null.")
  "The game it expands, by name."
  expands: String
  "What its video link searches YouTube for."
  video: String
  "Box art: a path on this site, or a BoardGameGeek image link."
  image: String
  bggId: Int
  year: Int
}

"What BoardGameGeek says about a game, by its id."
type BggInfo {
  bggId: Int!
  name: String!
  "BoardGameGeek's one-line summary."
  summary: String
  "1 (light) to 5 (heavy); null when nobody has rated it."
  weight: Float
  "Its honours, the owner's own awards among them as wins."
  honours: [Honour!]!
}

type Honour {
  name: String!
  year: Int
  "Winner, Nominee, Finalist, Recommended, 2nd Place, …"
  result: String!
}

"What BoardGameGeek has for a game."
type GameDetails {
  bggId: Int!
  "BoardGameGeek's name for the match, which may differ from the one looked up."
  name: String!
  year: Int
  min: Int!
  max: Int!
  mins: Int!
  desc: String!
  kw: [String!]!
  img: String
  "1 (light) to 5 (heavy); null when nobody has rated it."
  weight: Float
  "The wishlist section its players, weight, categories and mechanics put it under."
  section: String!
  "BoardGameGeek's one-line summary."
  summary: String
  "Its honours; empty when BoardGameGeek's site didn't answer."
  honours: [Honour!]!
}

type Preview {
  outcome: LookupOutcome!
  details: GameDetails
}

type EmailedSuggestion {
  suggestion: Suggestion!
  "What BoardGameGeek has for the suggestion, or for `game` when the owner corrects its name; null once it is decided."
  preview(game: String): Preview
}

type Decided {
  item: Suggestion
  "How the lookup went; null when none ran."
  lookup: LookupOutcome
}

"Details previewed before an approval or an add, sent back so the game isn't looked up twice."
input DetailsInput {
  bggId: Int
  year: Int
  min: Int
  max: Int
  mins: Int
  desc: String
  kw: [String!]
  img: String
  "The section the preview inferred."
  section: String
  "BoardGameGeek's weight, as the preview found it."
  weight: Float
}

"The owner's edits; a field left out keeps what is stored, and `type: null` files it under \"Suggested by friends\"."
input DetailsEdit {
  min: Int
  max: Int
  mins: Int
  desc: String
  kw: [String!]
  type: String
}

input HistoryEntry {
  role: Role!
  content: String!
}
