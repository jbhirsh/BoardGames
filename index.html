<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Game Room</title>
    <meta name="description" content="Our board game collection: find what fits tonight by players and time, read the rules with an AI helper, keep score and vote on what to buy next." />
    <meta name="theme-color" content="#FBFBFD" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
    <!-- A theme picked with the toggle (useTheme), in force before the first
         paint so a dark choice never flashes light. -->
    <script>
      try {
        var t = localStorage.getItem('gameroom:theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t;
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.content = t === 'dark' ? '#111113' : '#FBFBFD';
          });
        }
      } catch (e) {}
    </script>
    <!-- Link previews (group chats, social). Image and URL must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Game Room" />
    <meta property="og:title" content="The Game Room" />
    <meta property="og:description" content="Find what fits tonight, read the rules, keep score and vote on what to buy next." />
    <meta property="og:url" content="https://board-games-silk.vercel.app/" />
    <meta property="og:image" content="https://board-games-silk.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Our Game Room, with box art from Catan, Azul, 7 Wonders and more" />
    <meta name="twitter:card" content="summary_large_image" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
