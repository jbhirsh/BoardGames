<!doctype html>
<html
  lang="en"
  class="scroll-smooth bg-bg leading-[normal] [-webkit-font-smoothing:antialiased] motion-reduce:scroll-auto"
>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Add to Home Screen; the service worker (src/sw/sw.ts) keeps it working offline. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>The Game Room</title>
    <meta
      name="description"
      content="Our board game collection: find what fits tonight by players and time, read the rules with an AI helper, keep score and vote on what to buy next."
    />
    <meta name="theme-color" content="#FBFBFD" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
    <!-- A theme picked with the toggle (useTheme), in force before the first
         paint so a dark choice never flashes light. -->
    <script>
      try {
        var t = localStorage.getItem('gameroom:theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t;
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.content = t === 'dark' ? '#111113' : '#FBFBFD';
          });
        }
      } catch (e) {}
    </script>
    <!-- Link previews (group chats, social). Image and URL must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Game Room" />
    <meta property="og:title" content="The Game Room" />
    <meta
      property="og:description"
      content="Find what fits tonight, read the rules, keep score and vote on what to buy next."
    />
    <meta property="og:url" content="https://board-games-silk.vercel.app/" />
    <meta property="og:image" content="https://board-games-silk.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Our Game Room, with box art from Catan, Azul, 7 Wonders and more" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The headings' font (src/index.css), fetched beside the code rather than once the page has drawn. -->
    <link rel="preload" href="/fonts/playfair-display-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <!-- The page runs to the screen's edges (viewport-fit=cover), so an
       installed app's bottom bar reaches under the home indicator and pads
       itself clear of it (PhoneNav), as the filter sheet's buttons and the
       rules chat's field do. The page keeps clear of a landscape phone's
       notch at the sides and of anything over its top, where the pinned
       search bar and the rulebook's search stop under a band in the page's
       colour (the ::before). Each inset is 0 where nothing is there, as on a
       desktop. -->
  <body
    class="min-h-svh bg-bg pt-[env(safe-area-inset-top,0px)] pr-[env(safe-area-inset-right,0px)] pl-[env(safe-area-inset-left,0px)] font-sans font-normal text-text before:fixed before:inset-x-0 before:top-0 before:z-250 before:h-[env(safe-area-inset-top,0px)] before:bg-bg before:content-['']"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
