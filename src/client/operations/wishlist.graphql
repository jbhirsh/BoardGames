# The wishlist's games, votes and friends' suggestions (context/GamesContext.tsx,
# hooks/useWishlistVotes.ts, components/SuggestForm.tsx).

query WishlistVotes($ids: [String!]!, $anonId: String) {
  wishlistVotes(ids: $ids, anonId: $anonId) {
    counts {
      id
      count
    }
    myVotes
  }
}

mutation Vote($itemId: String!, $anonId: String!, $vote: Int!) {
  vote(itemId: $itemId, anonId: $anonId, vote: $vote) {
    count
  }
}

# Over GET (client/graphql.ts's query()), so the service worker can keep
# the last answer for offline use; the same for every caller. The worker
# (games() in sw/sw.ts) knows it by its operation name (routeFor in
# utils/offline.ts) and passes the request on as sent, so this document is
# written only here.
query Games {
  games {
    wishlist {
      id
      name
      source
      suggestedBy
      note
      players
      minPlayers
      maxPlayers
      dur
      minutes
      description
      keywords
      section
      expands
      video
      image
      bggId
      year
    }
    bgg {
      bggId
      name
      summary
      weight
      honours {
        name
        year
        result
      }
    }
  }
}

mutation SuggestGame($game: String!, $name: String!, $note: String) {
  suggestGame(game: $game, name: $name, note: $note) {
    id
  }
}
