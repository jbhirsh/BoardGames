# The pages the owner's emails link to (components/EmailedDecisionPage.tsx):
# each reads with a query, which changes nothing and answers only the
# signed-in owner, and acts only with a mutation when its button is pressed.

query EmailedSuggestion($id: String!, $game: String) {
  emailedSuggestion(id: $id) {
    suggestion {
      game
      name
      note
      status
    }
    preview(game: $game) {
      ...Preview
    }
  }
}

mutation DecideByLink($id: String!, $decision: Decision!, $game: String, $details: DetailsInput) {
  decideSuggestion(id: $id, decision: $decision, game: $game, details: $details) {
    item {
      game
    }
    lookup
  }
}
